<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1C1A17">
    <meta name="robots" content="noindex,follow">
    <meta name="description" content="이 주소는 미니고 이야기의 이전 동적 글 주소입니다. 검색 가능한 정적 글은 이야기 목록에서 확인해 주세요.">
    <meta name="author" content="미니고 · 브랜드 운영자">
    <link rel="canonical" href="https://minigo-stationery.vercel.app/story/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="미니고 이야기 글 안내">
    <meta property="og:description" content="검색 가능한 미니고의 정적 글은 이야기 목록에서 확인할 수 있습니다.">
    <meta property="og:url" content="https://minigo-stationery.vercel.app/story/">
    <title>글 상세 안내 | 미니고</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231C1A17'/%3E%3Crect x='14' y='13' width='12' height='38' fill='%23F6F1E7'/%3E%3Crect x='32' y='25' width='18' height='26' fill='%23FF4F2E'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="blog.css">
    <script src="../script.js" defer></script>
  </head>
  <body class="story-page post-page">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="../index.html#home" aria-label="미니고 홈">
          <span class="wordmark-dot" aria-hidden="true"></span>
          <span>미니고</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="메뉴 열기" data-menu-toggle onclick="toggleMenu()">
          <span></span><span></span>
        </button>
        <nav class="site-nav" id="site-menu" aria-label="주요 메뉴" data-menu>
          <a href="../index.html#about">내 소개</a>
          <a href="../index.html#products">제품</a>
          <a href="../index.html#stories">이야기</a>
          <a href="../index.html#contact">연락하기</a>
        </nav>
      </div>
    </header>

    <main class="post-shell" id="main">
      <a class="post-back" href="index.html"><span aria-hidden="true">←</span> 이야기 목록</a>
      <div id="post-content" aria-live="polite">
        <div class="post-notfound">
          <h1>미니고 이야기</h1>
          <p>아래 링크에서 모든 이야기를 확인할 수 있습니다.</p>
          <a href="index.html">이야기 목록 보기</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-main">
        <a class="wordmark wordmark-footer" href="../index.html#home"><span class="wordmark-dot" aria-hidden="true"></span><span>미니고</span></a>
        <p>매일 쓰는 것부터 기분 좋게.</p>
      </div>
      <nav class="footer-nav" aria-label="하단 메뉴">
        <a href="../index.html#about">내 소개</a>
        <a href="../index.html#products">제품</a>
        <a href="../index.html#stories">이야기</a>
        <a href="../index.html#contact">연락하기</a>
      </nav>
      <p class="copyright">© <span data-year>2026</span> MINIGO. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
      (function () {
        var main = document.getElementById("post-content");

        function element(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }

        function formatDate(value) {
          var date = new Date(value + "T00:00:00");
          if (isNaN(date)) return value || "";
          return new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
        }

        function renderBody(source) {
          var box = element("div", "post-body");
          String(source || "").replace(/\r\n/g, "\n").split(/\n\s*\n/).forEach(function (block) {
            block = block.trim();
            if (!block) return;
            var lines = block.split("\n");
            if (lines.every(function (line) { return /^- /.test(line.trim()); })) {
              var list = element("ul");
              lines.forEach(function (line) { list.appendChild(element("li", null, line.trim().slice(2))); });
              box.appendChild(list);
            } else if (/^## /.test(block)) {
              box.appendChild(element("h2", null, block.slice(3).trim()));
            } else {
              box.appendChild(element("p", null, block));
            }
          });
          return box;
        }

        function hrefOf(post) {
          return post.url ? String(post.url) : "post.html?id=" + encodeURIComponent(post.id || "");
        }

        function setAttribute(selector, attribute, value) {
          var node = document.querySelector(selector);
          if (node) node.setAttribute(attribute, value);
        }

        function addStructuredData(value) {
          var script = document.createElement("script");
          script.type = "application/ld+json";
          script.textContent = JSON.stringify(value);
          document.head.appendChild(script);
        }

        function setMetadata(post) {
          var title = String(post.title || "이야기");
          var description = String(post.description || post.summary || "").slice(0, 160);
          var url = post.url ? new URL(String(post.url), location.href).href : location.href.split("#")[0];
          var author = String(post.author || "").trim();
          document.title = title + " | 미니고";
          setAttribute('meta[name="description"]', "content", description);
          setAttribute('meta[name="author"]', "content", author);
          setAttribute('link[rel="canonical"]', "href", url);
          setAttribute('meta[property="og:title"]', "content", title);
          setAttribute('meta[property="og:description"]', "content", description);
          setAttribute('meta[property="og:url"]', "content", url);

          var article = {
            "@context": "https://schema.org",
            "@type": "BlogPosting",
            headline: title,
            description: description,
            datePublished: String(post.date || ""),
            dateModified: String(post.updated || post.date || ""),
            mainEntityOfPage: url,
            keywords: Array.isArray(post.tags) ? post.tags.map(String).join(", ") : ""
          };
          if (author) article.author = { "@type": "Person", name: author };
          addStructuredData(article);

          var faq = Array.isArray(post.faq) ? post.faq.filter(function (item) { return item && item.q && item.a; }) : [];
          if (faq.length) {
            addStructuredData({
              "@context": "https://schema.org",
              "@type": "FAQPage",
              mainEntity: faq.map(function (item) {
                return { "@type": "Question", name: String(item.q), acceptedAnswer: { "@type": "Answer", text: String(item.a) } };
              })
            });
          }
          addStructuredData({
            "@context": "https://schema.org",
            "@type": "BreadcrumbList",
            itemListElement: [
              { "@type": "ListItem", position: 1, name: "이야기", item: location.origin + location.pathname.replace(/post\.html$/, "") },
              { "@type": "ListItem", position: 2, name: title, item: url }
            ]
          });
        }

        function renderFaq(items) {
          var section = element("section", "post-faq");
          section.appendChild(element("h2", null, "자주 묻는 질문"));
          items.forEach(function (item) {
            var details = element("details");
            details.appendChild(element("summary", null, String(item.q)));
            details.appendChild(element("p", null, String(item.a)));
            section.appendChild(details);
          });
          return section;
        }

        function renderSources(items) {
          var section = element("section", "post-sources");
          section.appendChild(element("h2", null, "참고·출처"));
          var list = element("ol");
          items.forEach(function (item) {
            var listItem = element("li");
            if (item && item.url) {
              var link = element("a", null, String(item.title || item.url));
              link.href = String(item.url);
              link.rel = "noopener";
              link.target = "_blank";
              listItem.appendChild(link);
            } else {
              listItem.textContent = String((item && item.title) || item || "");
            }
            list.appendChild(listItem);
          });
          section.appendChild(list);
          return section;
        }

        function notFound() {
          main.textContent = "";
          var box = element("div", "post-notfound");
          box.appendChild(element("h1", null, "글을 찾을 수 없습니다"));
          box.appendChild(element("p", null, "주소가 잘못되었거나 삭제된 글일 수 있습니다."));
          var link = element("a", null, "이야기 목록으로 돌아가기");
          link.href = "index.html";
          box.appendChild(link);
          main.appendChild(box);
        }

        function render(posts) {
          var query = new URLSearchParams(location.search);
          var id = query.get("id") || query.get("slug");
          var sorted = (Array.isArray(posts) ? posts : []).slice().sort(function (a, b) {
            return String(b.date || "").localeCompare(String(a.date || ""));
          });
          var index = sorted.findIndex(function (post) {
            return String(post.id) === id || (post.url && String(post.url).replace(/\.html$/, "") === id);
          });
          if (index < 0) { notFound(); return; }

          var post = sorted[index];
          setMetadata(post);
          main.textContent = "";
          var article = element("article", "post-article");
          var header = element("header", "post-head");
          var time = element("time", null, formatDate(post.date));
          time.setAttribute("datetime", String(post.date || ""));
          header.appendChild(time);
          header.appendChild(element("h1", null, String(post.title || "(제목 없음)")));

          if (post.author || (post.updated && post.updated !== post.date)) {
            var meta = element("p", "post-meta");
            var values = [];
            if (post.author) values.push(String(post.author));
            if (post.updated && post.updated !== post.date) values.push("수정 " + formatDate(post.updated));
            meta.textContent = values.join(" · ");
            header.appendChild(meta);
          }

          if (Array.isArray(post.tags) && post.tags.length) {
            var tags = element("div", "blog-tags");
            post.tags.forEach(function (tag) { tags.appendChild(element("span", "blog-tag", String(tag))); });
            header.appendChild(tags);
          }

          article.appendChild(header);
          article.appendChild(element("hr", "post-rule"));
          article.appendChild(renderBody(post.body));
          var faq = Array.isArray(post.faq) ? post.faq.filter(function (item) { return item && item.q && item.a; }) : [];
          if (faq.length) article.appendChild(renderFaq(faq));
          if (Array.isArray(post.sources) && post.sources.length) article.appendChild(renderSources(post.sources));

          var previous = sorted[index + 1];
          var next = sorted[index - 1];
          if (previous || next) {
            var navigation = element("nav", "post-neighbors");
            navigation.setAttribute("aria-label", "다른 이야기");
            function addNeighbor(item, className, label) {
              if (!item) { navigation.appendChild(element("span")); return; }
              var link = element("a", className);
              link.href = hrefOf(item);
              link.appendChild(element("span", "post-neighbor-label", label));
              link.appendChild(element("strong", null, String(item.title || "")));
              navigation.appendChild(link);
            }
            addNeighbor(previous, "previous", "이전 글");
            addNeighbor(next, "next", "다음 글");
            article.appendChild(navigation);
          }
          main.appendChild(article);
        }

        fetch("posts.json", { cache: "no-store" })
          .then(function (response) { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
          .then(render)
          .catch(notFound);
      })();
    </script>
  </body>
</html>
