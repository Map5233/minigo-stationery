<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1C1A17">
    <meta name="description" content="미니고가 제품을 만들고 사용하는 과정에서 발견한 이야기를 기록합니다.">
    <link rel="canonical" href="https://minigo-stationery.vercel.app/story/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="미니고 이야기">
    <meta property="og:description" content="작은 손의 편안한 시작을 돕는 미니고의 기록">
    <meta property="og:url" content="https://minigo-stationery.vercel.app/story/">
    <meta property="og:image" content="https://minigo-stationery.vercel.app/assets/minigo-pencil-grip-7color.jpg">
    <title>이야기 | 미니고</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231C1A17'/%3E%3Crect x='14' y='13' width='12' height='38' fill='%23F6F1E7'/%3E%3Crect x='32' y='25' width='18' height='26' fill='%23FF4F2E'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="blog.css">
    <script src="../script.js" defer></script>
  </head>
  <body class="story-page">
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="../index.html#home" aria-label="미니고 홈">
          <span class="wordmark-dot" aria-hidden="true"></span>
          <span>미니고</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="메뉴 열기" data-menu-toggle onclick="toggleMenu()">
          <span></span><span></span>
        </button>
        <nav class="site-nav" id="site-menu" aria-label="주요 메뉴" data-menu>
          <a href="../index.html#about">내 소개</a>
          <a href="../index.html#products">제품</a>
          <a href="../index.html#stories">이야기</a>
          <a href="../index.html#contact">연락하기</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="story-hero" aria-labelledby="story-title">
        <div class="story-hero-inner">
          <p class="story-eyebrow">MINIGO JOURNAL</p>
          <h1 id="story-title">잘 쓰는 생활을<br><span>기록합니다.</span></h1>
          <div class="story-intro-row">
            <p>아이의 손을 관찰하고, 제품을 고치고, 더 편안한 방법을 찾아가는 과정을 나눕니다.</p>
            <a class="story-admin-link" href="admin.html">글 관리 <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </section>

      <section class="story-index-section" aria-labelledby="latest-title">
        <div class="story-index-head">
          <p>STORIES</p>
          <h2 id="latest-title">최근 이야기</h2>
        </div>
        <ol class="blog-list" id="list" aria-live="polite">
          <li class="blog-state">이야기를 불러오는 중입니다.</li>
        </ol>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-main">
        <a class="wordmark wordmark-footer" href="../index.html#home"><span class="wordmark-dot" aria-hidden="true"></span><span>미니고</span></a>
        <p>매일 쓰는 것부터 기분 좋게.</p>
      </div>
      <nav class="footer-nav" aria-label="하단 메뉴">
        <a href="../index.html#about">내 소개</a>
        <a href="../index.html#products">제품</a>
        <a href="../index.html#stories">이야기</a>
        <a href="../index.html#contact">연락하기</a>
      </nav>
      <p class="copyright">© <span data-year>2026</span> MINIGO. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
      (function () {
        var list = document.getElementById("list");

        function element(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }

        function formatDate(value) {
          var date = new Date(value + "T00:00:00");
          if (isNaN(date)) return value || "";
          return new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
        }

        function render(posts) {
          list.textContent = "";
          var sorted = Array.isArray(posts) ? posts.slice().sort(function (a, b) {
            return String(b.date || "").localeCompare(String(a.date || ""));
          }) : [];

          if (!sorted.length) {
            list.appendChild(element("li", "blog-state", "첫 번째 이야기를 준비하고 있습니다."));
            return;
          }

          sorted.forEach(function (post, index) {
            var item = element("li", "blog-card");
            var link = element("a");
            link.href = post.url ? String(post.url) : "post.html?id=" + encodeURIComponent(post.id || "");
            var number = element("span", "blog-card-number", String(index + 1).padStart(2, "0"));
            number.setAttribute("aria-hidden", "true");
            var content = element("div", "blog-card-content");
            var time = element("time", null, formatDate(post.date));
            time.setAttribute("datetime", String(post.date || ""));
            content.appendChild(time);
            content.appendChild(element("h3", null, String(post.title || "(제목 없음)")));
            if (post.summary) content.appendChild(element("p", "blog-card-summary", String(post.summary)));
            if (Array.isArray(post.tags) && post.tags.length) {
              var tags = element("div", "blog-tags");
              post.tags.forEach(function (tag) { tags.appendChild(element("span", "blog-tag", String(tag))); });
              content.appendChild(tags);
            }
            var arrow = element("span", "blog-card-arrow", "↗");
            arrow.setAttribute("aria-hidden", "true");
            link.append(number, content, arrow);
            item.appendChild(link);
            list.appendChild(item);
          });
        }

        fetch("posts.json", { cache: "no-store" })
          .then(function (response) { if (!response.ok) throw new Error(String(response.status)); return response.json(); })
          .then(render)
          .catch(function () {
            list.textContent = "";
            list.appendChild(element("li", "blog-state", "이야기를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."));
          });
      })();
    </script>
  </body>
</html>
